name: Android APK (experimental)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'scripts/patch_app.py'
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Fetch upstream app
        run: git clone --depth 1 https://github.com/BuSung-dev/Root-My-Galaxy.git upstream
      - name: Apply Safe Root integration
        run: python3 scripts/patch_app.py
      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-app-build
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
