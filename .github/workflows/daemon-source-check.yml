name: KernelSU Safe Root source verification
on:
  workflow_dispatch:
    inputs:
      source_zip_url:
        description: 'Optional HTTPS override for the reviewed source archive'
        required: false
        default: 'https://github.com/gamer765/Root-My-Galaxy-Safe-Root/releases/download/safe-root-dev-1/KernelSU-Next-safe-root-source.zip'
        type: string
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download supplied source (never substitute upstream)
        env:
          SOURCE_URL: ${{ inputs.source_zip_url }}
        run: |
          case "$SOURCE_URL" in https://*) ;; *) echo 'Only HTTPS source URLs accepted' >&2; exit 1;; esac
          curl --fail --location --retry 2 --output source.zip "$SOURCE_URL"
          unzip -q source.zip -d source
      - name: Validate Safe Root implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          roots = list(Path('source').glob('*/userspace/ksud/src'))
          assert len(roots) == 1, 'Expected exactly one KernelSU source tree'
          root = roots[0]
          cli = (root / 'cli.rs').read_text()
          late = (root / 'late_load.rs').read_text()
          assert 'safe_mode: bool' in cli
          assert 'safe_mode,' in cli
          assert 'if !safe_mode {' in late
          assert 'SAFE ROOT:' in late
          print('Safe Root source checks passed')
          PY
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare Android cross compiler
        run: |
          rustup target add aarch64-linux-android
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - name: Build ARM64 Android daemon (experimental)
        working-directory: source/KernelSU-Next-samsung-lateload-sync/userspace/ksud
        env:
          LIBCLANG_PATH: /usr/lib/llvm-14/lib
        run: cargo build --release --target aarch64-linux-android --locked
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ksud-safe-root-arm64-experimental
          path: source/KernelSU-Next-samsung-lateload-sync/userspace/ksud/target/aarch64-linux-android/release/ksud
          if-no-files-found: error
